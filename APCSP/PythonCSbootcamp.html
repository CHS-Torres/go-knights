<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP CSP Python Survival Camp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Toggle menu">☰</button>
  <a class="brand" href="#home"><span class="logo">🐍</span><span>AP CSP <b>Python Survival Camp</b></span></a>
  <div class="rankbox" title="Your rank">
    <span id="rankIcon" class="rank-icon">🌱</span>
    <div class="rank-info">
      <b id="rankName">Apprentice</b>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
    <span id="xpText" class="xp-text">0 XP</span>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Modules"></nav>
  <main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
